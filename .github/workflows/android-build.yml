name: Build and Sign Tycoon APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '22' # Fixed: Upgraded from 20 to 22 to satisfy Capacitor CLI

    - name: Clean Build Workspace Environment
      run: |
        rm -rf android
        rm -rf node_modules

    - name: Install Pure Project Dependencies
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Compile and Sync Native Android Wrappers
      run: |
        npx cap add android
        npx cap copy android

    - name: Compile Release APK (Gradle)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Extract Code Signing Certificate from Vault
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/bigspender-release.jks

    - name: Inject Secure Cryptographic Signature
      run: |
        cd android/app/build/outputs/apk/release/
        ${ANDROID_HOME}/build-tools/34.0.0/apksigner sign \
          --ks ../../../../bigspender-release.jks \
          --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
          --ks-key-alias ${{ secrets.KEY_ALIAS }} \
          --out BigSpenderTycoon.apk \
          app-release-unsigned.apk

    - name: Upload Finished Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BigSpenderTycoon-SignedGame
        path: android/app/build/outputs/apk/release/BigSpenderTycoon.apk