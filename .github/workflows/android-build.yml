name: Build and Sign Tycoon APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Clean Build Workspace Environment
      run: |
        rm -rf android
        rm -rf node_modules

    - name: Install Pure Project Dependencies
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Compile and Sync Native Android Wrappers
      run: |
        npx cap add android
        npx cap copy android

    - name: Build Native App Package (Gradle)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BigSpenderTycoon-GameFile
        path: android/app/build/outputs/apk/debug/app-debug.apk